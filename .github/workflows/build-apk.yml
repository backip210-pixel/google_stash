name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: |
          sdkmanager "platforms;android-34"
          sdkmanager "build-tools;34.0.0"
          sdkmanager "platform-tools"

      - name: Generate native Android project
        run: npx expo prebuild --platform android --clean

      - name: Fix settings.gradle plugin repositories
        working-directory: android
        run: |
          # Add repositories to existing pluginManagement block
          sed -i '/pluginManagement {/a\    repositories {\n        gradlePluginPortal()\n        mavenCentral()\n        google()\n    }' settings.gradle
          cat settings.gradle | head -15

      - name: Build APK with React Native CLI
        run: npx react-native build-android --mode=debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: StashPhotos-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
