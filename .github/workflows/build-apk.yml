name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: |
          sdkmanager "platforms;android-34"
          sdkmanager "build-tools;34.0.0"
          sdkmanager "platform-tools"

      - name: Generate native Android project
        run: npx expo prebuild --platform android --clean

      - name: Fix settings.gradle plugin repositories
        working-directory: android
        run: |
          python3 << 'PYEOF'
          import subprocess
          import os
          
          # Get paths
          expo_path = subprocess.check_output(["node", "--print", "require.resolve('expo/package.json')"]).decode().strip()
          rn_path = subprocess.check_output(["node", "--print", "require.resolve('react-native/package.json')"]).decode().strip()
          cli_path = subprocess.check_output(["node", "--print", "require('@react-native-community/cli-platform-android/package.json')"]).decode().strip()
          
          settings_content = f"""pluginManagement {{
              repositories {{
                  gradlePluginPortal()
                  mavenCentral()
                  google()
              }}
          }}
          
          rootProject.name = 'StashPhotos'
          
          apply from: new File("{expo_path}", "../scripts/autolinking.gradle")
          useExpoModules()
          
          apply from: new File("{cli_path}", "../native_modules.gradle")
          applyNativeModulesSettingsGradle(settings)
          
          include ':app'
          includeBuild(new File("{rn_path}").getParentFile())
          """
          
          with open('settings.gradle', 'w') as f:
              f.write(settings_content)
          
          print("settings.gradle created successfully")
          PYEOF

      - name: Build APK with Gradle
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: StashPhotos-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
