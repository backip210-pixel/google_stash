<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Stash Photos — Signing in...</title>
  <style>
    body {
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      background: #0d1117;
      color: #e6edf3;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      text-align: center;
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid #30363d;
      border-top-color: #58a6ff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    p { margin: 0; font-size: 14px; color: #8b949e; }
    .error { color: #f85149; }
    .debug { font-size: 10px; color: #8b949e; margin-top: 16px; word-break: break-all; white-space: pre-wrap; }
  </style>
</head>
<body>
  <div>
    <div class="spinner"></div>
    <p>Completing sign-in...</p>
    <div class="debug" id="debug"></div>
  </div>
  <script>
    const debugEl = document.getElementById('debug');
    
    // Read the access_token from the URL hash
    var hash = window.location.hash;
    debugEl.textContent = 'Hash: ' + hash.substring(0, 100);
    
    var params = new URLSearchParams(hash.substring(1));
    var token = params.get('access_token');
    var error = params.get('error');
    var errorDesc = params.get('error_description');

    if (error) {
      document.body.innerHTML = '<p class="error">Sign-in failed: ' + errorDesc + '</p><p><a href="javascript:window.close()">Close</a></p>';
    } else if (token) {
      debugEl.textContent += '\nToken length: ' + token.length;
      
      // Use encodeURIComponent to preserve the token exactly
      var appUrl = 'stashphotos://auth?access_token=' + encodeURIComponent(token);
      debugEl.textContent += '\nRedirecting...';
      
      // Use location.replace to avoid history issues
      window.location.replace(appUrl);

      // Fallback: if the app doesn't open within 3 seconds, show error
      setTimeout(function() {
        document.body.innerHTML = '<p class="error">App did not open automatically.</p><p style="font-size:12px">Token length: ' + token.length + '</p>';
      }, 3000);
    } else {
      document.body.innerHTML = '<p class="error">No authentication token received.</p><p style="font-size:10px">Hash: ' + hash.substring(0, 200) + '</p>';
    }
  </script>
</body>
</html>
