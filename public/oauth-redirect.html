<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Stash Photos — Signing in...</title>
  <style>
    body {
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      background: #0d1117;
      color: #e6edf3;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      text-align: center;
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid #30363d;
      border-top-color: #58a6ff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    p { margin: 0; font-size: 14px; color: #8b949e; }
  </style>
</head>
<body>
  <div>
    <div class="spinner"></div>
    <p>Completing sign-in...</p>
  </div>
  <script>
    // Read the access_token from the URL hash
    var hash = window.location.hash;
    var params = new URLSearchParams(hash.substring(1));
    var token = params.get('access_token');
    var error = params.get('error');
    var errorDesc = params.get('error_description');

    if (error) {
      document.body.innerHTML = '<p style="color:#f85149;">Sign-in failed: ' + errorDesc + '</p><p><a href="javascript:window.close()">Close</a></p>';
    } else if (token) {
      // Redirect to the app's custom scheme with the token
      // This triggers the Android intent filter and opens the app
      var appUrl = 'stashphotos://auth?access_token=' + encodeURIComponent(token);
      window.location.href = appUrl;

      // Fallback: if the app doesn't open within 2 seconds, show instructions
      setTimeout(function() {
        document.body.innerHTML = '<p>If the app did not open automatically,<br>you may need to install it first.</p>';
      }, 2000);
    } else {
      document.body.innerHTML = '<p style="color:#f85149;">No authentication token received.</p>';
    }
  </script>
</body>
</html>
